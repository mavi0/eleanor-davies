<style>
  :root {
    --woodland: #1d3b2a;
    --moss: #2c5239;
    --paper: #f1eef8;
    --ink: #221d33;
    --bluebell: #5a4bc2;
    --cap: #9c3d52;
  }
  * { box-sizing: border-box; }
  html { font-family: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    padding: 2rem 1rem;
    background:
      radial-gradient(circle at 20% 15%, var(--moss), transparent 55%),
      var(--woodland);
    color: var(--ink);
  }

  .card {
    width: min(100%, 23rem);
    background: var(--paper);
    border-radius: 1.25rem;
    padding: .75rem .75rem 1rem;
    box-shadow: 0 1.5rem 3rem -1rem rgba(6, 20, 12, .6);
  }

  .photo {
    display: block; width: 100%; height: auto; aspect-ratio: 1;
    object-fit: cover; object-position: 60% 40%;
    border-radius: .75rem;
  }

  .photo-wrap { position: relative; margin: 0; }
  .photo-wrap::after {
    content: ""; position: absolute; inset: 45% 0 0; border-radius: 0 0 .75rem .75rem;
    background: linear-gradient(to top, rgba(24, 18, 48, .78), transparent);
  }
  h1 {
    position: absolute; left: 1rem; bottom: .9rem; z-index: 1; margin: 0;
    font-size: 4.25rem; line-height: .82; font-weight: 800;
    font-variation-settings: "wdth" 75, "opsz" 96;
    letter-spacing: -.02em;
    color: var(--paper);
  }
  h1 span { display: block; }

  .ways { display: flex; justify-content: center; gap: 1.5rem; margin: 1rem 0 0; padding: 0; list-style: none; }
  .way { display: block; padding: .5rem; border-radius: .6rem; color: var(--bluebell); }
  .way svg { display: block; width: 2.25rem; height: 2.25rem; fill: currentColor; }
  .way:hover { color: var(--cap); }
  .way:focus-visible { outline: 2px solid var(--bluebell); outline-offset: 2px; }

  @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
    /* The deeper shadow is pre-drawn and faded in: animating box-shadow repaints every frame and stutters the zoom. */
    .card { position: relative; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
    .card::after {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
      box-shadow: 0 2rem 4rem -1rem rgba(6, 20, 12, .7);
      opacity: 0; transition: opacity .35s;
    }
    .card:hover { transform: scale(1.025); }
    .card:hover::after { opacity: 1; }
  }

  @media (max-width: 380px) {
    h1 { font-size: 3.5rem; }
  }
</style>
